services:
# !service-block:
  {service}:
    # !rule exact
    container_name: {service}
    build:
      # !rule exact
      context: .
      # !rule exact
      dockerfile: docker/Dockerfile
      args:
        # !rule repo
        GIT_REPO: {git_repo}
        # !rule presence
        GIT_TAG: {git_tag}
    # !rule presence
    restart: no
    # !rule volume-target
    volumes:
      - type: bind
        source: /data/{package}_files
        target: /app/persisted_data
    # !if dep("aeth-ext"):
    # !rule env-keys
    environment:
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
    # !end
    # !rule presence
    networks:
      - coolify
    healthcheck:
      # !rule exact-list
      test:
        - CMD-SHELL
        - bash -ec '[ -f /app/persisted_data/logs/heartbeat.txt ] && ts=$$(cat /app/persisted_data/logs/heartbeat.txt 2>/dev/null) && [ -n "$$ts" ] && hb=$$(date -d "$$ts" +%s 2>/dev/null) && now=$$(date +%s) && [ $$((now - hb)) -lt 180 ]'
      # !rule exact
      interval: 30s
      # !rule exact
      timeout: 5s
      # !rule exact
      retries: 3
      # !rule exact
      start_period: 15s
# !end service-block

networks:
  coolify:
    external: true
