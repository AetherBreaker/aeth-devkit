[project]
  name            = "aeth-devkit"
  version         = "9.0.0"
  description     = "Personal project-maintenance toolkit: poe tasks plus the devkit CLI"
  readme          = "README.md"
  requires-python = ">=3.14"
  # poethepoet is the runner itself, and the `clean` task calls its `poethepoet.scripts:rm`.
  # poethepoet-tasks is deliberately absent: only crates/aeth-devkit/build.rs imports it, so
  # it is a build requirement (see [build-system]) rather than something consumers install.
  dependencies    = [
    "poethepoet>=0.46.0",
  ]

[dependency-groups]
  # The pytest plugins are declared rather than relied on transitively, because `--strict-config`
  # plus the template's `[tool.pytest.ini_options]` makes a bare `pytest` *fail* without them:
  # addopts passes --cov (pytest-cov) and the config sets asyncio_mode (pytest-asyncio).
  dev = [
    "maturin>=1.7,<2",
    "poethepoet>=0.46.0",
    "poethepoet-tasks>=0.3.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "tombi>=1.5",
  ]                             # setup-project added: "poethepoet>=0.46.0"

[build-system]
  # poethepoet-tasks is a build requirement because `crates/aeth-devkit/build.rs` regenerates
  # the baked poe task table during the build, and the generator imports it. A PEP 517 build
  # runs in an isolated environment holding only what is listed here.
  requires      = ["maturin>=1.7,<2", "poethepoet-tasks>=0.3.0"]
  build-backend = "maturin"

[tool.coverage.run]
  data_file   = ".cache/.coverage"
  source_pkgs = ["aeth_devkit"]

[tool.coverage.report]
  show_missing = true

[tool.coverage.html]
  directory = ".cache/htmlcov"

[tool.coverage.xml]
  output = ".cache/coverage.xml"

[tool.coverage.lcov]
  output = ".cache/coverage.lcov"

[tool.docker]
  # Paths relative to /app that the entrypoint will chown to nonroot:nonroot.
  # Typically these are directories that will be bind-mounted as Docker volumes.
  chown_paths = [
    "persisted_data",
  ]
  # Paths relative to /app that the entrypoint will create (mkdir -p) and chown.
  # These are implicitly included in the chown step.
  mkdirs      = []

[tool.maturin]
  bindings      = "bin"
  manifest-path = "crates/aeth-devkit/Cargo.toml"
  module-name   = "aeth_devkit"
  python-source = "python"

  # `_tasks_source.py` imports poethepoet_tasks, which is a build requirement rather than a
  # runtime one, so in an installed wheel it would be a module that cannot be imported.
  # Nothing imports it at runtime, but it should not ship. The sdist keeps it: that is what
  # build.rs regenerates the baked table from during a source build.
  exclude = [{ path = "python/aeth_devkit/_tasks_source.py", format = "wheel" }]

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.pyright]
  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  typeCheckingMode = "standard"

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  reportDeprecated                    = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true

  executionEnvironments     = [{ root = "python", extraPaths = ["python"] }]
  reportMissingTypeArgument = false

[tool.pytest.ini_options]
  addopts      = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra",
  ]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  src       = ["./python", "../*/src", "../*/python"]  # setup-project added: "../*/src", "../*/python"
  cache-dir = ".cache/ruff"

  # Applies `exclude`/`extend-exclude` even to paths named explicitly on the command line
  # (the stop hook always does). Without it, the hook's `ruff check --fix <changed files>`
  # ignores this list entirely -- it only governs directory-traversal discovery by default --
  # and reformats a generated file nothing here is meant to touch.
  force-exclude = true

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
    # Written by crates/aeth-devkit/build.rs in pprint's shape, not ruff's; the test that
    # compares it byte-for-byte against a fresh build depends on nothing ever reformatting it.
    "python/aeth_devkit/_tasks_generated.py",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "UP",
      "D",
      "TID",
    ]                  # setup-project added: "D", "TID"
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["aeth_devkit"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

    [tool.ruff.lint.flake8-tidy-imports.banned-api."__future__.annotations"]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.per-file-ignores]
      # No missing-docstring rules in tests: a test's name is its summary, and test docstrings
      # read to agents as statements of intent that were never reviewed. D2xx+ still apply to
      # docstrings a test does have.
      "tests/**" = ["D1"]

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true

[[tool.uv.index]]
  name        = "SFTPyPI"
  url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
  publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
  explicit    = true
