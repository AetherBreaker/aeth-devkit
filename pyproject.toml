[project]
  name            = "poe-tasks"
  version         = "4.4.0"
  description     = "Shared poe tasks for SFT projects"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = [
    "poethepoet>=0.46.0",
    "poethepoet-tasks>=0.3.0",
  ]

[dependency-groups]
  dev = [
    "pyright>=1.1.411",
  ]

[build-system]
  requires      = [
    "uv_build>=0.11.2,<0.12.0",
  ]
  build-backend = "uv_build"

[tool.poe]
  include_script = "poe_tasks:tasks"

[tool.pyright]
  extends = "../pyproject.toml"

[tool.ruff]
  extend = "../pyproject.toml"

  src = ["./src"]

[[tool.uv.index]]
  name        = "SFTPyPI"
  url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
  publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
  explicit    = true
