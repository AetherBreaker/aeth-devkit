[project]
  name            = "poe-tasks"
  version         = "5.0.0"
  description     = "Shared poe tasks for SFT projects"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = [
    "poethepoet>=0.46.0",
    "poethepoet-tasks>=0.3.0",
  ]

[dependency-groups]
  dev = [
    "pyright>=1.1.411",
  ]

[build-system]
  requires      = ["maturin>=1.7,<2"]
  build-backend = "maturin"

[tool.maturin]
  bindings      = "bin"
  module-name   = "poe_tasks"
  python-source = "src"
  manifest-path = "Cargo.toml"

[tool.poe]
  include_script = [{ script = "poe_tasks:tasks", executor = { type = "uv", frozen = true } }]

[tool.pyright]
  extends = "../pyproject.toml"

[tool.ruff]
  extend = "../pyproject.toml"

  src = ["./src"]

[[tool.uv.index]]
  name        = "SFTPyPI"
  url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
  publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
  explicit    = true
