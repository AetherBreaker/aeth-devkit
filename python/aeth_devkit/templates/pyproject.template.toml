#:schema https://json.schemastore.org/pyproject.json
# setup-project template — merged into each project's pyproject.toml by `devkit setup-project`.
# Scalars here replace the project's values; arrays are unioned (additions are commented
# on the merged line); keys absent here are never touched.
#
# Placeholders: {package} → the project's import name; {python_dir} → "src", or "python"
# for mixed Rust/Python projects where src/ belongs to cargo.

[dependency-groups]
  # Every tool this template writes config for below, so a fresh project can actually run the
  # thing it was just configured for. The pytest entries are not optional: [tool.pytest]
  # sets --strict-config, which turns a missing plugin into a hard failure, so a bare `pytest`
  # errors out without pytest-cov (addopts passes --cov) and pytest-asyncio (asyncio_mode).
  # mypy is deliberately absent -- [tool.mypy] is `if-dep mypy` gated and stays opt-in.
  dev = [
    "poethepoet>=0.46.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "tombi>=1.5",
  ]

[tool.coverage]
  [tool.coverage.run]
    data_file   = ".cache/.coverage"
    source_pkgs = ["{package}"]

  [tool.coverage.report]
    show_missing = true

  [tool.coverage.html]
    directory = ".cache/htmlcov"

  [tool.coverage.xml]
    output = ".cache/coverage.xml"

  [tool.coverage.lcov]
    output = ".cache/coverage.lcov"

# setup-project: if-docker
[tool.docker]
  # Paths relative to /app that the entrypoint will chown to nonroot:nonroot.
  # Typically these are directories that will be bind-mounted as Docker volumes.
  chown_paths = [
    "persisted_data",
  ]
  # Paths relative to /app that the entrypoint will create (mkdir -p) and chown.
  # These are implicitly included in the chown step.
  mkdirs      = []

# setup-project: if-dep mypy
[tool.mypy]
  cache_dir = ".cache/mypy"

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.pyright]
  typeCheckingMode = "standard"

  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  # reportConstantRedefinition          = true
  reportDeprecated                    = true
  # reportMissingSuperCall              = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  # reportMissingTypeArgument           = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true
  reportMissingTypeArgument           = false

  executionEnvironments = [{ root = "{python_dir}", extraPaths = ["{python_dir}"] }]

[tool.pytest.ini_options]
  addopts      = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra",
  ]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  cache-dir = ".cache/ruff"
  # Sister projects' packages count as first-party (ruff `src` supports globs).
  src       = ["./{python_dir}", "../*/src", "../*/python"]

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "D",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "TID",
      "UP",
    ]
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.flake8-tidy-imports.banned-api]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      "__future__.annotations".msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["{package}"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true
