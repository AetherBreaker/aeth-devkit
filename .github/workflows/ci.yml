name: "Verify: Rust checks, Python tests, wheel, template render"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: fmt, clippy, tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # The Rust job deliberately has no Python environment, so crates/aeth-devkit/build.rs cannot
  # regenerate the baked poe task table there and silently falls back to the committed one.
  # This job is what actually exercises generation, on both platforms: Linux covers
  # find_python's bin/python branch and POSIX script paths, which nothing else touches.
  tests:
    name: "Python: pytest and baked task table up to date (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: uv sync, uv run pytest
        run: |
          uv sync
          uv run pytest

      - name: The baked task table must match its source
        run: git diff --exit-code -- python/aeth_devkit/_tasks_generated.py

  wheel:
    name: "Wheel: maturin build and devkit CLI smoke (windows-latest)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: maturin develop, then devkit --version, setup-project --help, poe lock --dry-run
        run: |
          uv sync
          uv run maturin develop
          uv run devkit --version
          uv run devkit setup-project --help
          uv run poe lock --dry-run

  # The engine against the released templates: a change here that breaks a template shape
  # is caught before a release. A dry run, so no `aeth-devkit==<this version>` is resolved
  # (a plain run's package step would, and would fail on the commit that bumps the version
  # before its wheel exists).
  render:
    name: "Templates: dry-run the templates repo's main through this tree's devkit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: setup-project --dry-run into python, rust and docker scratch projects; each must report a change
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p aeth-devkit
          # Only the templates package: its aeth-devkit floor is a runtime dependency, and
          # this job's devkit is the one just built.
          uv venv "$RUNNER_TEMP/tpl" --python 3.14
          # main of the templates repo, not the last release: this job checks the two trees against each other, and a language change lands in both before either is released.
          uv pip install --python "$RUNNER_TEMP/tpl/bin/python" --no-deps "devkit-templates @ git+https://github.com/AetherBreaker/devkit-templates@main"
          tpl="$("$RUNNER_TEMP/tpl/bin/python" -c 'import devkit_templates, os; print(os.path.join(os.path.dirname(devkit_templates.__file__), "templates"))')"
          for kind in python rust docker; do
            root="$RUNNER_TEMP/scratch-$kind"
            # A package directory under python/ marks a mixed Rust/Python layout; src/ otherwise.
            pkg_dir=src; [ "$kind" = rust ] && pkg_dir=python
            mkdir -p "$root/$pkg_dir/scratch_app"
            : > "$root/$pkg_dir/scratch_app/__init__.py"
            if [ "$kind" = rust ]; then
              printf '[package]\nname = "scratch-app"\nversion = "0.1.0"\nedition = "2024"\n\n[lib]\npath = "src/lib.rs"\n' > "$root/Cargo.toml"
              mkdir -p "$root/src" && : > "$root/src/lib.rs"
            fi
            {
              printf '[project]\nname = "scratch-app"\nversion = "0.1.0"\nrequires-python = ">=3.14"\ndependencies = []\n\n'
              if [ "$kind" = docker ]; then printf '[tool.docker]\nservices = ["scratch-app"]\n\n'; fi
              # publish-url: the release workflow's publish block renders only with one.
              printf '[[tool.uv.index]]\nname = "SFTPyPI"\nurl = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"\npublish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"\nexplicit = true\n'
            } > "$root/pyproject.toml"
            # A Docker project is refused without devkit-container in its environment (a plain
            # run installs it; a dry run cannot), so the scratch venv gets the release.
            if [ "$kind" = docker ]; then
              uv venv "$root/.venv" --python 3.14
              uv pip install --python "$root/.venv/bin/python" --index "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple" devkit-container
            fi
            target/debug/devkit setup-project --root "$root" --templates-dir "$tpl" --dry-run --no-vscode | tee "$root/out.txt"
            grep -q '^Would change:' "$root/out.txt"
          done
