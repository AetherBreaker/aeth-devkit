[workspace]
  resolver = "3"
  members  = ["crates/*"]

[workspace.package]
  version = "9.0.0"
  edition = "2024"
  publish = false

[workspace.dependencies]
  anyhow     = "1.0.104"
  base64     = "0.22.1"
  clap       = { version = "4", features = ["derive"] }
  ctrlc      = "3.5.1"
  pep440_rs  = "0.7.3"
  regex      = "1.13.1"
  serde      = "1.0.229"
  shell-words = "1.1.0"
  serde_json = { version = "1.0.151", features = ["preserve_order"] }
  tempfile   = "3.27.0"
  terminal_size = "0.4.4"
  toml_edit  = "0.25.13"
  ureq       = { version = "3.4.0", features = ["json"] }

  aeth-devkit-core  = { path = "crates/aeth-devkit-core" }
  aeth-devkit-setup = { path = "crates/aeth-devkit-setup" }
  aeth-devkit-lock  = { path = "crates/aeth-devkit-lock" }
  aeth-devkit-release = { path = "crates/aeth-devkit-release" }
  aeth-devkit-pin   = { path = "crates/aeth-devkit-pin" }
  aeth-devkit-complete = { path = "crates/aeth-devkit-complete" }
  aeth-devkit-hooks = { path = "crates/aeth-devkit-hooks" }

[profile.release]
  strip       = true
  incremental = true
